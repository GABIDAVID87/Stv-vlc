name: Build VLC Segovia TV

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Git identity
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          echo "Git identity:"
          git config --global user.name
          git config --global user.email

      - name: Prepare VLC Gradle helper
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Creating Gradle version helper..."

          mkdir -p buildsystem/gradle_version

          cat > buildsystem/gradle_version/build.gradle <<'EOF'
          println 'gradle_version=' + gradle.getGradleVersion()
          EOF

          echo "Helper created:"
          cat buildsystem/gradle_version/build.gradle

      - name: Initialize VLC build environment
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Workspace:"
          pwd

          echo "Checking VLC build system..."

          test -f buildsystem/compile.sh

          chmod +x buildsystem/compile.sh

          echo "Gradle version:"
          gradle --version

          echo "Git identity:"
          git config --global user.name
          git config --global user.email

          echo "Starting VLC initialization..."

          ./buildsystem/compile.sh --init -b

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Checking Gradle wrapper..."

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Building VLC Segovia TV..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          mkdir -p artifacts

          find . \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            -exec cp -v {} artifacts/ \;

          echo ""
          echo "APK files found:"
          ls -lh artifacts

          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Segovia-TV-debug
          path: artifacts/*.apk
          if-no-files-found: error
