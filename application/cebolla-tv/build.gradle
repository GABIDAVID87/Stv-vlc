plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.segovia.tv'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk 17
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility rootProject.ext.targetJVM
        targetCompatibility rootProject.ext.targetJVM
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appCompatVersion"
    implementation "androidx.activity:activity:$rootProject.ext.androidxActivityVersion"
    implementation "com.google.android.material:material:$rootProject.ext.androidxMaterialVersion"
    implementation "androidx.media:media:$rootProject.ext.mediaVersion"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$rootProject.ext.desugarLib"
}
